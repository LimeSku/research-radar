name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.14"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run radar self-check

