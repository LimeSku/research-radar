[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-radar"
version = "0.1.0"
description = "Agentic scientific literature monitoring and searchable research memory."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "Sacha Evain" }]
dependencies = [
  "fastapi>=0.116",
  "httpx>=0.28",
  "jinja2>=3.1",
  "openai>=1.99",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "uvicorn>=0.35",
]

[project.scripts]
radar = "research_radar.cli:main"

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_radar"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

