services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - radar-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://radar:radar@db:5432/radar
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_CURATION_BATCH_SIZE: ${AI_CURATION_BATCH_SIZE:-8}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-research-radar@example.com}
      ENABLE_PUBLIC_ASK: ${ENABLE_PUBLIC_ASK:-false}
      SOURCE_REPOSITORY_URL: ${SOURCE_REPOSITORY_URL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  radar-data:
